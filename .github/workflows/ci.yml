name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          go mod tidy --diff

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./tests/...

      - name: Build Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o movie-ticket-api ./cmd/api

      - name: Validate Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: movie-ticket-api:test
